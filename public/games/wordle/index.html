<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wordle Unlimited</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .header {
      text-align: center;
      margin-bottom: 14px;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #38bdf8;
    }
    .grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .tile {
      width: 52px;
      height: 52px;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 6px;
      background: #1e293b;
      transition: all 0.2s ease;
    }
    .tile.correct { background: #16a34a; border-color: #16a34a; color: #fff; }
    .tile.present { background: #ca8a04; border-color: #ca8a04; color: #fff; }
    .tile.absent { background: #475569; border-color: #475569; color: #fff; }
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      max-width: 480px;
      width: 100%;
    }
    .kb-row {
      display: flex;
      gap: 5px;
    }
    .key {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 4px;
      padding: 12px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      min-width: 32px;
      text-align: center;
      transition: background 0.15s;
    }
    .key.wide { min-width: 55px; }
    .key.correct { background: #16a34a; }
    .key.present { background: #ca8a04; }
    .key.absent { background: #1e293b; color: #64748b; }
    .msg-toast {
      margin-top: 10px;
      min-height: 24px;
      font-size: 14px;
      font-weight: 600;
      color: #facc15;
    }
    .btn-new {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">WORDLE</div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="msg-toast" id="msg"></div>
  <div class="keyboard" id="keyboard"></div>

  <button class="btn-new" id="new-btn" style="display:none;">Next Word</button>

  <script>
    const WORDS = [
      "REACT", "GAMES", "CLOUD", "PIXEL", "SPACE", "BLOCK", "SHINE", "TRACK", "LEVEL",
      "QUEST", "SCORE", "SMART", "BRAIN", "POWER", "NINJA", "FORCE", "FLASH", "MAGIC",
      "SWORD", "LASER", "BOARD", "CHESS", "COLOR", "DRIVE", "PULSE", "CYBER", "ROBOT"
    ];

    let target = WORDS[Math.floor(Math.random() * WORDS.length)];
    let guesses = Array(6).fill("");
    let currentGuess = "";
    let currentRow = 0;
    let gameOver = false;

    const gridEl = document.getElementById('grid');
    const kbEl = document.getElementById('keyboard');
    const msgEl = document.getElementById('msg');
    const newBtn = document.getElementById('new-btn');

    function initBoard() {
      gridEl.innerHTML = '';
      for (let r = 0; r < 6; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }
        gridEl.appendChild(row);
      }
    }

    const KEY_ROWS = [
      ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
      ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
      ["ENTER", "Z", "X", "C", "V", "B", "N", "M", "⌫"]
    ];

    function initKeyboard() {
      kbEl.innerHTML = '';
      KEY_ROWS.forEach(rowKeys => {
        const rDiv = document.createElement('div');
        rDiv.className = 'kb-row';
        rowKeys.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'key' + (k.length > 1 ? ' wide' : '');
          btn.textContent = k;
          btn.id = `key-${k}`;
          btn.onclick = () => handleKey(k);
          rDiv.appendChild(btn);
        });
        kbEl.appendChild(rDiv);
      });
    }

    function handleKey(key) {
      if (gameOver) return;

      if (key === 'ENTER') {
        if (currentGuess.length !== 5) {
          msgEl.textContent = 'Not enough letters!';
          setTimeout(() => msgEl.textContent = '', 1500);
          return;
        }
        submitGuess();
      } else if (key === '⌫' || key === 'BACKSPACE') {
        currentGuess = currentGuess.slice(0, -1);
        updateRow();
      } else if (/^[A-Z]$/.test(key) && currentGuess.length < 5) {
        currentGuess += key;
        updateRow();
      }
    }

    function updateRow() {
      for (let c = 0; c < 5; c++) {
        const tile = document.getElementById(`tile-${currentRow}-${c}`);
        tile.textContent = currentGuess[c] || '';
      }
    }

    function submitGuess() {
      const targetLetters = target.split('');
      const guessLetters = currentGuess.split('');
      const status = Array(5).fill('absent');

      // First pass: correct
      guessLetters.forEach((l, i) => {
        if (l === targetLetters[i]) {
          status[i] = 'correct';
          targetLetters[i] = null;
        }
      });

      // Second pass: present
      guessLetters.forEach((l, i) => {
        if (status[i] !== 'correct' && targetLetters.includes(l)) {
          status[i] = 'present';
          targetLetters[targetLetters.indexOf(l)] = null;
        }
      });

      // Apply classes
      guessLetters.forEach((l, i) => {
        const tile = document.getElementById(`tile-${currentRow}-${i}`);
        tile.classList.add(status[i]);

        const keyBtn = document.getElementById(`key-${l}`);
        if (keyBtn) {
          if (status[i] === 'correct') {
            keyBtn.className = 'key correct';
          } else if (status[i] === 'present' && !keyBtn.classList.contains('correct')) {
            keyBtn.className = 'key present';
          } else if (status[i] === 'absent' && !keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) {
            keyBtn.className = 'key absent';
          }
        }
      });

      if (currentGuess === target) {
        msgEl.textContent = 'Splendid! You guessed it!';
        gameOver = true;
        newBtn.style.display = 'block';
      } else if (currentRow === 5) {
        msgEl.textContent = `Game Over! Word was: ${target}`;
        gameOver = true;
        newBtn.style.display = 'block';
      } else {
        currentRow++;
        currentGuess = '';
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleKey('ENTER');
      else if (e.key === 'Backspace') handleKey('⌫');
      else {
        const k = e.key.toUpperCase();
        if (/^[A-Z]$/.test(k)) handleKey(k);
      }
    });

    newBtn.onclick = () => {
      target = WORDS[Math.floor(Math.random() * WORDS.length)];
      currentGuess = "";
      currentRow = 0;
      gameOver = false;
      msgEl.textContent = '';
      newBtn.style.display = 'none';
      initBoard();
      initKeyboard();
    };

    initBoard();
    initKeyboard();
  </script>
</body>
</html>
