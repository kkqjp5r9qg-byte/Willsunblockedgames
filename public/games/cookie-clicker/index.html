<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cookie Clicker Mini</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      display: flex;
      gap: 24px;
      max-width: 600px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .left-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .cookie-count {
      font-size: 28px;
      font-weight: 800;
      color: #fbbf24;
      font-variant-numeric: tabular-nums;
    }
    .cps-count {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .cookie-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d97706, #78350f);
      border: 6px solid #b45309;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      position: relative;
      transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
    }
    .cookie-btn:active {
      transform: scale(0.92);
    }
    .chocolate-chip {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #451a03;
      border-radius: 50%;
    }
    .right-section {
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .shop-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }
    .upgrade-btn {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: #e2e8f0;
      transition: all 0.15s;
      text-align: left;
    }
    .upgrade-btn:hover:not(:disabled) {
      background: #1e293b;
      border-color: #64748b;
    }
    .upgrade-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .upgrade-info .name {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
    }
    .upgrade-info .desc {
      font-size: 11px;
      color: #94a3b8;
    }
    .upgrade-cost {
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
    }
    .float-text {
      position: absolute;
      color: #facc15;
      font-weight: 800;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-45px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-section">
      <div id="cookies-display" class="cookie-count">0</div>
      <div id="cps-display" class="cps-count">0 cookies per second</div>

      <button id="cookie-btn" class="cookie-btn">
        <div class="chocolate-chip" style="top: 30px; left: 40px;"></div>
        <div class="chocolate-chip" style="top: 80px; left: 30px;"></div>
        <div class="chocolate-chip" style="top: 50px; left: 85px;"></div>
        <div class="chocolate-chip" style="top: 95px; left: 90px;"></div>
        <div class="chocolate-chip" style="top: 25px; left: 105px;"></div>
      </button>
    </div>

    <div class="right-section">
      <div class="shop-title">Bakeries & Upgrades</div>
      <div id="upgrades-list"></div>
    </div>
  </div>

  <script>
    let cookies = parseFloat(localStorage.getItem('cookie_clicks') || '0');
    let clickPower = 1;

    const items = [
      { id: 'cursor', name: 'Auto-Clicker', baseCost: 15, cps: 0.5, count: 0 },
      { id: 'grandma', name: 'Grandma', baseCost: 100, cps: 4, count: 0 },
      { id: 'farm', name: 'Cookie Farm', baseCost: 1100, cps: 32, count: 0 },
      { id: 'mine', name: 'Cookie Mine', baseCost: 12000, cps: 260, count: 0 }
    ];

    // Load saved counts
    items.forEach(it => {
      it.count = parseInt(localStorage.getItem('cookie_' + it.id) || '0', 10);
    });

    const cookieBtn = document.getElementById('cookie-btn');
    const cookiesDisplay = document.getElementById('cookies-display');
    const cpsDisplay = document.getElementById('cps-display');
    const upgradesList = document.getElementById('upgrades-list');

    function getCPS() {
      return items.reduce((acc, it) => acc + (it.cps * it.count), 0);
    }

    function getItemCost(it) {
      return Math.floor(it.baseCost * Math.pow(1.15, it.count));
    }

    function renderUpgrades() {
      upgradesList.innerHTML = '';
      items.forEach(it => {
        const cost = getItemCost(it);
        const btn = document.createElement('button');
        btn.className = 'upgrade-btn';
        btn.disabled = cookies < cost;
        btn.onclick = () => buyItem(it);
        btn.innerHTML = `
          <div class="upgrade-info">
            <div class="name">${it.name} (${it.count})</div>
            <div class="desc">+${it.cps} cps</div>
          </div>
          <div class="upgrade-cost">🍪 ${cost}</div>
        `;
        upgradesList.appendChild(btn);
      });
    }

    function buyItem(it) {
      const cost = getItemCost(it);
      if (cookies >= cost) {
        cookies -= cost;
        it.count++;
        localStorage.setItem('cookie_' + it.id, it.count);
        saveCookies();
        updateUI();
      }
    }

    function saveCookies() {
      localStorage.setItem('cookie_clicks', Math.floor(cookies));
    }

    function updateUI() {
      cookiesDisplay.textContent = Math.floor(cookies).toLocaleString() + ' Cookies';
      cpsDisplay.textContent = `${getCPS().toFixed(1)} cookies per second`;
      renderUpgrades();
    }

    cookieBtn.addEventListener('click', (e) => {
      cookies += clickPower;
      updateUI();

      // Floating +1 number
      const float = document.createElement('div');
      float.className = 'float-text';
      float.textContent = `+${clickPower}`;
      float.style.left = `${e.clientX - 10}px`;
      float.style.top = `${e.clientY - 20}px`;
      document.body.appendChild(float);
      setTimeout(() => float.remove(), 800);
    });

    // Game ticker (10 times a second)
    setInterval(() => {
      const cps = getCPS();
      if (cps > 0) {
        cookies += cps / 10;
        updateUI();
      }
    }, 100);

    // Save auto
    setInterval(saveCookies, 5000);

    updateUI();
  </script>
</body>
</html>
