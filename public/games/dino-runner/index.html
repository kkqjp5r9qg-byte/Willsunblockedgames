<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dino T-Rex Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    #canvas {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: block;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="600" height="240"></canvas>
  <div class="hint">Press <b>SPACE</b> or <b>↑</b> to Jump | <b>↓</b> to Duck</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    let score = 0;
    let highScore = parseInt(localStorage.getItem('dino_best') || '0', 10);
    let speed = 6;
    let gameOver = false;
    let started = false;

    const GROUND_Y = H - 40;

    const dino = {
      x: 50,
      y: GROUND_Y - 42,
      w: 36,
      h: 42,
      vy: 0,
      jumpStrength: -11.5,
      gravity: 0.65,
      grounded: true,
      ducking: false
    };

    let obstacles = [];
    let obsTimer = 0;
    let clouds = [];

    function initClouds() {
      clouds = [
        { x: 100, y: 30, w: 46, speed: 0.6 },
        { x: 340, y: 55, w: 54, speed: 0.8 },
        { x: 520, y: 25, w: 40, speed: 0.5 }
      ];
    }
    initClouds();

    function jump() {
      if (!started || gameOver) {
        restart();
        return;
      }
      if (dino.grounded) {
        dino.vy = dino.jumpStrength;
        dino.grounded = false;
      }
    }

    function duck(isDuck) {
      if (dino.grounded) {
        dino.ducking = isDuck;
        dino.h = isDuck ? 24 : 42;
        dino.y = GROUND_Y - dino.h;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
      if (e.code === 'ArrowDown') {
        e.preventDefault();
        duck(true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') {
        duck(false);
      }
    });

    canvas.addEventListener('mousedown', jump);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

    function restart() {
      score = 0;
      speed = 6;
      obstacles = [];
      obsTimer = 0;
      dino.y = GROUND_Y - 42;
      dino.h = 42;
      dino.vy = 0;
      dino.grounded = true;
      dino.ducking = false;
      gameOver = false;
      started = true;
    }

    function spawnObstacle() {
      const isBird = Math.random() < 0.28 && score > 200;
      if (isBird) {
        const heights = [GROUND_Y - 26, GROUND_Y - 50];
        const birdY = heights[Math.floor(Math.random() * heights.length)];
        obstacles.push({
          type: 'bird',
          x: W + 20,
          y: birdY,
          w: 32,
          h: 22
        });
      } else {
        const isDouble = Math.random() < 0.35 && score > 150;
        obstacles.push({
          type: 'cactus',
          x: W + 20,
          y: GROUND_Y - 38,
          w: isDouble ? 34 : 18,
          h: 38
        });
      }
    }

    function update() {
      if (!started || gameOver) return;

      score += 0.15;
      if (score > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem('dino_best', highScore);
      }

      speed = 6 + Math.floor(score / 200) * 0.7;

      // Dino physics
      if (!dino.grounded) {
        dino.vy += dino.gravity;
        dino.y += dino.vy;
        if (dino.y >= GROUND_Y - dino.h) {
          dino.y = GROUND_Y - dino.h;
          dino.vy = 0;
          dino.grounded = true;
        }
      }

      // Obstacles
      obsTimer++;
      if (obsTimer > Math.max(50, 110 - Math.floor(speed * 4))) {
        obsTimer = 0;
        spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision box
        const pad = 4;
        if (
          dino.x + pad < obs.x + obs.w &&
          dino.x + dino.w - pad > obs.x &&
          dino.y + pad < obs.y + obs.h &&
          dino.y + dino.h - pad > obs.y
        ) {
          gameOver = true;
        }

        if (obs.x < -60) obstacles.splice(i, 1);
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -60) c.x = W + 40;
      });
    }

    function draw() {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, W, H);

      // Clouds
      ctx.fillStyle = '#334155';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
        ctx.arc(c.x + 14, c.y - 4, 16, 0, Math.PI * 2);
        ctx.arc(c.x + 28, c.y, 12, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(W, GROUND_Y);
      ctx.stroke();

      // Dino
      ctx.fillStyle = '#38bdf8';
      if (!dino.ducking) {
        ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
        // Eye
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(dino.x + dino.w - 10, dino.y + 6, 4, 4);
      } else {
        ctx.fillRect(dino.x, dino.y, dino.w + 10, dino.h);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(dino.x + dino.w, dino.y + 4, 4, 4);
      }

      // Obstacles
      obstacles.forEach(obs => {
        if (obs.type === 'cactus') {
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          ctx.fillRect(obs.x - 4, obs.y + 8, obs.w + 8, 4);
        } else {
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          // wing
          ctx.beginPath();
          ctx.moveTo(obs.x + 6, obs.y);
          ctx.lineTo(obs.x + 16, obs.y - 8);
          ctx.lineTo(obs.x + 26, obs.y);
          ctx.fill();
        }
      });

      // Score HUD
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`HI ${String(highScore).padStart(5, '0')}  ${String(Math.floor(score)).padStart(5, '0')}`, W - 20, 30);

      if (!started) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 20px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Press SPACE or Click to Start', W / 2, H / 2);
      } else if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 26px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 12);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '14px system-ui';
        ctx.fillText('Press SPACE or Click to Restart', W / 2, H / 2 + 18);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
